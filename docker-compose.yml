services:
  panteon:
    build:
      context: .
      dockerfile: Dockerfile.panteon
    ports:
      - "8080:8080"
    environment:
      PANTEON_TTS_URL: http://pavarotti:8000
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PANTEON_NOTIFY_WEBHOOK: ${PANTEON_NOTIFY_WEBHOOK:-}
      PANTEON_TELEGRAM_TOKEN: ${PANTEON_TELEGRAM_TOKEN:-}
      PANTEON_TELEGRAM_CHAT_ID: ${PANTEON_TELEGRAM_CHAT_ID:-}
      PANTEON_LLM_BASE_URL: ${PANTEON_LLM_BASE_URL:-}
      PANTEON_LLM_MODEL: ${PANTEON_LLM_MODEL:-}
      PANTEON_LLM_API_KEY: ${PANTEON_LLM_API_KEY:-}
    volumes:
      - panteon_workspace:/workspace
    depends_on:
      - pavarotti
    restart: unless-stopped

  pavarotti:
    build:
      context: ./services/pavarotti
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    ports:
      - "8000:8000"
      - "7860:8000"  # compatibilidad con la UI Gradio anterior
    environment:
      CHATTERBOX_DEVICE: ${CHATTERBOX_DEVICE:-cpu}
      CHATTERBOX_LANGUAGE: ${CHATTERBOX_LANGUAGE:-es}
      TORCH_THREADS: ${TORCH_THREADS:-4}
      HF_HOME: /models
      VOICE_DIR: /voices
    volumes:
      - chatterbox_models:/models
      - ./services/pavarotti/voices:/voices
    restart: unless-stopped
    # Para GPU NVIDIA, descomenta y usa TORCH_INDEX_URL de CUDA:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  panteon_workspace:
  chatterbox_models:
